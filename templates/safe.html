<!DOCTYPE html>
<html>
<head>
<title>Safe Environment</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial;
    background:linear-gradient(135deg,#16a34a,#22c55e);
    overflow:hidden;
}

/* floating circles */
.circle{
 position:absolute;
 width:120px;
 height:120px;
 background:rgba(255,255,255,.15);
 border-radius:50%;
 animation:float 8s infinite ease-in-out;
}

.circle:nth-child(1){
 top:20%;
 left:10%;
}

.circle:nth-child(2){
 bottom:25%;
 right:15%;
 animation-delay:2s;
}

@keyframes float{
 0%{transform:translateY(0)}
 50%{transform:translateY(-40px)}
 100%{transform:translateY(0)}
}

/* main card */
.card{
 background:rgba(0,0,0,.3);
 padding:40px;
 border-radius:20px;
 text-align:center;
 color:white;
 width:90%;
 max-width:350px;
 animation:pop .8s ease;
 box-shadow:0 0 40px rgba(0,0,0,.6);
}

@keyframes pop{
 0%{transform:scale(.5);opacity:0}
 100%{transform:scale(1);opacity:1}
}

/* tick animation */
.tick{
 font-size:70px;
 animation:bounce 1.5s infinite;
}

@keyframes bounce{
 0%{transform:scale(1)}
 50%{transform:scale(1.2)}
 100%{transform:scale(1)}
}

button{
 width:100%;
 padding:12px;
 margin-top:15px;
 border:none;
 border-radius:10px;
 background:#38bdf8;
 color:black;
 font-weight:bold;
 font-size:16px;
 cursor:pointer;
 transition:.3s;
}

button:hover{
 transform:scale(1.05);
 background:#0ea5e9;
}
</style>
</head>

<body>

<div class="circle"></div>
<div class="circle"></div>

<div class="card">

<div class="tick">✅</div>

<h1>Safe Environment</h1>

<p>Everything is under control now.<br>
Great job for acting quickly!</p>

<a href="/dashboard">
<button>Back to Dashboard</button>
</a>

</div>

</body>
</html>

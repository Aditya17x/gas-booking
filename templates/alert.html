<!DOCTYPE html>
<html>
<head>
<title>Hazard Alert</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:{{color}};
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

/* flashing background */
@keyframes pulse{
  0%{filter:brightness(1)}
  50%{filter:brightness(1.2)}
  100%{filter:brightness(1)}
}
body{
 animation:pulse 1.5s infinite;
}

/* main card */
.card{
    background:rgba(0,0,0,.35);
    padding:35px;
    border-radius:20px;
    color:white;
    text-align:center;
    width:90%;
    max-width:350px;
    box-shadow:0 0 40px rgba(0,0,0,.7);
    animation:zoom 0.7s ease;
}

@keyframes zoom{
  0%{transform:scale(.6);opacity:0}
  100%{transform:scale(1);opacity:1}
}

/* warning icon */
.icon{
  font-size:50px;
  animation:shake .8s infinite;
}

@keyframes shake{
  0%{transform:rotate(0)}
  25%{transform:rotate(5deg)}
  50%{transform:rotate(-5deg)}
  75%{transform:rotate(5deg)}
  100%{transform:rotate(0)}
}

h1{
 margin:10px 0;
 letter-spacing:2px;
}

/* action text */
p{
 font-size:15px;
 opacity:.9;
}

/* resolve button */
button{
 width:100%;
 padding:12px;
 border:none;
 border-radius:10px;
 background:#22c55e;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
 margin-top:15px;
 transition:.3s;
}

button:hover{
 transform:scale(1.05);
 background:#16a34a;
}
</style>
</head>

<body>

<div class="card">

<div class="icon">⚠️</div>

<h1>{{type|upper}} ALERT</h1>

<h3>{{scenario}}</h3>

<p>{{action}}</p>

<form method="POST" action="/resolved">
<button>✔ Mark as Resolved</button>
</form>

</div>

</body>
</html>

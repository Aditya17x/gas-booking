<!DOCTYPE html>
<html>
<head>
<title>High Temperature</title>

<style>
body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#ff512f,#f09819);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

.wave{
position:absolute;
width:200%;
height:200px;
background:rgba(255,255,255,.2);
bottom:0;
animation:wave 4s infinite linear;
}

@keyframes wave{
0%{transform:translateX(0)}
100%{transform:translateX(-50%)}
}

.card{
background:#7c2d12;
color:white;
padding:30px;
border-radius:18px;
width:90%;
max-width:380px;
box-shadow:0 0 60px orange;
}

button{
width:100%;
padding:12px;
margin-top:12px;
border:none;
border-radius:10px;
background:#fde047;
font-weight:bold;
}
</style>
</head>

<body>

<div class="wave"></div>

<div class="card">
<h2>🌡 High Temperature</h2>

<form method="POST" action="/hazard/heat/check">

<button name="scenario" value="Appliances overheating">Appliances Overheating</button>
<button name="scenario" value="Poor ventilation">Poor Ventilation</button>
<button name="scenario" value="Near stove">Near Stove</button>

<input type="hidden" name="level" value="High">

</form>

</div>

</body>
</html>

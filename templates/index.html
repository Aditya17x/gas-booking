<!DOCTYPE html>
<html>
<head>
<title>Gas Booking</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#e0eafc,#cfdef3);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

/* BACK BUTTON */
.back-btn{
position:absolute;
top:20px;
left:20px;
background:rgba(255,255,255,.7);
padding:8px 16px;
border-radius:20px;
text-decoration:none;
color:black;
font-weight:600;
backdrop-filter:blur(10px);
transition:.3s;
}
.back-btn:hover{
background:#2563eb;
color:white;
}

/* blobs */
.blob{
position:absolute;
width:220px;height:220px;
background:rgba(255,255,255,.7);
border-radius:50%;
filter:blur(90px);
animation:float 8s infinite alternate;
z-index:-1;
}
.blob:nth-child(1){top:10%;left:10%}
.blob:nth-child(2){bottom:10%;right:10%;animation-delay:3s}

@keyframes float{
from{transform:translateY(0)}
to{transform:translateY(-60px)}
}

/* main card */
.wrapper{
width:370px;
background:rgba(255,255,255,.4);
backdrop-filter:blur(25px);
padding:28px;
border-radius:22px;
border:1px solid rgba(255,255,255,.45);
box-shadow:0 20px 50px rgba(0,0,0,.1);
}

/* steps */
.steps{
display:flex;
justify-content:space-between;
margin-bottom:18px;
}
.step{font-size:13px;color:#777}
.step.active{color:#2563eb;font-weight:600}

/* inputs */
input[type="text"],
input[type="number"],
input[type="date"],
select,textarea{
width:100%;
padding:12px;
margin:8px 0;
border:1px solid rgba(255,255,255,.8);
border-radius:12px;
background:rgba(255,255,255,.7);
outline:none;
}

/* radio */
.radio-group{
display:flex;
align-items:center;
gap:10px;
margin-top:10px;
}
input[type="radio"]{
width:18px;height:18px;
cursor:pointer;
}

/* buttons */
.next{
width:100%;
height:50px;
background:linear-gradient(135deg,#2563eb,#1e40af);
color:white;
border:none;
border-radius:12px;
font-size:17px;
font-weight:600;
margin-top:20px;
cursor:pointer;
box-shadow:0 8px 20px rgba(37,99,235,.4);
transition:.2s;
}
.next:active{transform:scale(.96)}

.back{
background:#e5e7eb;
color:black;
margin-top:10px;
}

/* info */
.info{
background:rgba(0,0,0,.04);
padding:15px;
border-radius:12px;
font-size:12px;
margin:15px 0;
line-height:1.5;
color:#444;
}

/* steps hide */
.step-box{display:none}
.step-box.active{display:block}
</style>
</head>

<body>

<a href="/dashboard" class="back-btn">⬅ Dashboard</a>

<div class="blob"></div>
<div class="blob"></div>

<div class="wrapper">

<div class="steps">
<span class="step active" id="s1">Step 1</span>
<span class="step" id="s2">Step 2</span>
<span class="step" id="s3">Step 3</span>
</div>

<form action="/submit" method="POST">

<!-- STEP 1 -->
<div class="step-box active" id="step1">

<h3>Personal Details</h3>

<input name="name" id="name" type="text" placeholder="Full Name">
<input name="phone" id="phone" type="text" placeholder="Phone Number">
<textarea name="address" id="address" placeholder="Address"></textarea>
<input name="city" id="city" type="text" placeholder="City">

<h4>Cylinder Details</h4>

<div class="radio-group">
<input type="radio" name="cylinder" value="Domestic">
<label><b>Domestic</b></label>
</div>
<div style="font-size:12px;margin-left:28px;color:#666">
• 14.2 kg <br>• 5 kg <br>• 2 kg
</div>

<div class="radio-group">
<input type="radio" name="cylinder" value="Commercial">
<label><b>Commercial</b></label>
</div>
<div style="font-size:12px;margin-left:28px;color:#666">
• 19 kg <br>• 47.5 kg
</div>

<select name="company" id="company">
<option value="">Select Company</option>
<option>HP Gas</option>
<option>Bharat Gas</option>
<option>Indane Gas</option>
</select>

<input name="quantity" id="qty" type="number" placeholder="Quantity">

<div class="info">
<b>SAFETY TIPS:</b><br>
• Keep protective cap during transport.<br>
• Store cylinders 20 feet apart.<br>
• Keep in ventilated areas.
</div>

<button type="button" class="next" onclick="next1()">Next</button>
</div>

<!-- STEP 2 -->
<div class="step-box" id="step2">

<h3>Delivery Details</h3>
<label>Select Delivery Date</label><input type="text" id="date"
placeholder="Select Date"
onfocus="this.type='date'"
onblur="if(this.value==''){this.type='text'}">

<select name="slot" id="slot">
<option value="">Select Slot</option>
<option>Morning</option>
<option>Afternoon</option>
<option>Evening</option>
</select>

<button type="button" class="next back" onclick="back1()">Back</button>
<button type="button" class="next" onclick="next2()">Next</button>

</div>

<!-- STEP 3 -->
<div class="step-box" id="step3">

<h3>Payment</h3>

<label><input type="radio" name="payment" value="COD"> Cash on Delivery</label><br>
<label><input type="radio" name="payment" value="UPI"> UPI</label><br>
<label><input type="radio" name="payment" value="Online"> Online</label><br><br>

<button type="button" class="next back" onclick="back2()">Back</button>
<button type="submit" class="next">Confirm Booking</button>

</div>

</form>
</div>

<script>
function next1(){
let ids=["name","phone","address","city","company","qty"];
let ok=ids.every(id=>document.getElementById(id).value!="");
let cyl=document.querySelector('input[name="cylinder"]:checked');

if(!ok||!cyl){
alert("Fill all fields first!");
return;
}
go(1,2);
}

function next2(){
let d=document.getElementById("date").value;
let s=document.getElementById("slot").value;
if(d==""||s==""){
alert("Select date & slot!");
return;
}
go(2,3);
}

function back1(){go(2,1)}
function back2(){go(3,2)}

function go(a,b){
document.getElementById("step"+a).classList.remove("active");
document.getElementById("step"+b).classList.add("active");
document.getElementById("s"+a).classList.remove("active");
document.getElementById("s"+b).classList.add("active");
}
</script>

</body>
</html>
